---
# Rôle common : mise à jour du cache apt, paquets de base, fuseau horaire
# et durcissement SSH. Toutes les tâches sont idempotentes.

- name: Mettre a jour le cache apt (au plus une fois par heure)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Definir le fuseau horaire
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Durcir la configuration SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: sshd -t -f %s
  loop:
    - regexp: "^#?PermitRootLogin"
      line: "PermitRootLogin {{ common_ssh_permit_root_login }}"
    - regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication {{ common_ssh_password_authentication }}"
  loop_control:
    label: "{{ item.line }}"
  notify: Restart sshd

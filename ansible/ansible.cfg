# Configuration Ansible du projet NeoCargo TrackFleet.
# Sous WSL, si le dépôt est sur /mnt/c, Ansible ignore ce fichier (dossier
# "world-writable") : faites  export ANSIBLE_CONFIG=$PWD/ansible.cfg
[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
remote_user = ubuntu
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining = True
